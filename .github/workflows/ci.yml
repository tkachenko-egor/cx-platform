name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    # B1: tests, seed and eval run against a real Postgres (pgvector).
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: cx
          POSTGRES_PASSWORD: cx
          POSTGRES_DB: cx_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cx -d cx_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://cx:cx@localhost:5432/cx_platform
      TEST_DATABASE_URL: postgres://cx:cx@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      # FR-12.4: the deterministic regression gate — routing/tool-selection/
      # escalation/guardrail accuracy against the golden dataset, driven by
      # ScriptedProvider/StubProvider so it needs no API key and is fully
      # blocking. (An optional real-model LLM-as-judge subset, FR-12.3, is
      # a "Should" not built yet — see docs/00-requirements.md.)
      - run: npm run eval
